services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ryde
      POSTGRES_PASSWORD: ryde
      POSTGRES_DB: ryde
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:
